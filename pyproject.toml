[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation-detection"
version = "0.1.0"
description = "Vision-Based Constellation Detection and Recognition Using Hybrid Computer Vision and Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "opencv-python>=4.7",
    "scipy>=1.9",
    "scikit-image>=0.20",
    "matplotlib>=3.6",
    "Pillow>=9.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "ruff>=0.3",
]
dl = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
